    'postcss@>=8 <8.5.23': '8.5.23'
    'qs@>=6 <6.16.1': '6.16.1'
    'tmp@>=0 <0.2.7': '0.2.7'
    'undici@>=6 <6.24.0': '6.24.0'
    'underscore@>=1 <1.13.8': '1.13.8'
    uuid: '11.1.1'
