packages:
    - 'packages/**'
    - '!packages/**/test-input/**'
    - '!packages/**/test-output/**'
allowBuilds:
    '@parcel/watcher': true
    '@vscode/vsce-sign': true
    esbuild: true
    keytar: true
minimumReleaseAgeExclude:
    - '@vscode/vsce-sign-alpine-arm64@2.0.8'
    - '@vscode/vsce-sign-alpine-x64@2.0.8'
    - '@vscode/vsce-sign-darwin-arm64@2.0.8'
    - '@vscode/vsce-sign-darwin-x64@2.0.8'
    - '@vscode/vsce-sign-linux-arm64@2.0.8'
    - '@vscode/vsce-sign-linux-arm@2.0.8'
    - '@vscode/vsce-sign-linux-x64@2.0.8'
    - '@vscode/vsce-sign-win32-arm64@2.0.8'
    - '@vscode/vsce-sign-win32-x64@2.0.8'
    - '@vscode/vsce-sign@2.1.1'
    - '@vscode/vsce@4.1.1'
overrides:
    cross-spawn: '>=7.0.5'
    handlebars: '>=4.7.9'
    '@babel/helpers': '>=7.26.10'
    '@babel/runtime': '>=7.26.10'
    '@opentelemetry/core@>=1 <1.30.1': '1.30.1'
    axios: '>=1.20.0'
    'brace-expansion@>=1 <2': '1.1.21'
    'brace-expansion@>=2 <2.0.3': '2.0.3'
    'diff@>=4 <4.0.4': '4.0.4'
    'fast-uri@>=3 <3.1.9': '3.1.9'
    'flatted@>=3 <3.4.2': '3.4.2'
    'glob@>=9.0.0 <14.0.2': '14.0.2'
    'immutable@>=4 <4.3.8': '4.3.8'
    'js-yaml@>=3 <3.15.2': '3.15.2'
    'js-yaml@>=4 <4.3.2': '4.3.2'
    'linkify-it@>=3 <5.0.2': '5.0.2'
    'markdown-it@>=12 <14.3.3': '14.3.3'
    'lodash@>=4 <4.18.0': '4.18.1'
    'lodash-es@>=4 <4.18.0': '4.18.1'
    'micromatch@>=4 <4.0.8': '4.0.8'
